<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hideout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <div id="hud">
            <h1>HIDEOUT</h1>
            <div id="status">STARÝ DŮM · 001</div>
        </div>
        <div id="inventory">
            <button class="inventory-slot selected" data-slot="0" type="button"><span class="slot-number">1</span><span class="slot-item"></span></button>
            <button class="inventory-slot" data-slot="1" type="button"><span class="slot-number">2</span><span class="slot-item"></span></button>
            <button class="inventory-slot" data-slot="2" type="button"><span class="slot-number">3</span><span class="slot-item"></span></button>
            <button class="inventory-slot" data-slot="3" type="button"><span class="slot-number">4</span><span class="slot-item"></span></button>
            <button class="inventory-slot" data-slot="4" type="button"><span class="slot-number">5</span><span class="slot-item"></span></button>
        </div>
        <div id="health-bar">
            <div id="health-info"><span>HEALTH</span><span id="health-text">100 / 100</span></div>
            <div id="health-track"><div id="health-fill"></div></div>
            <div id="water-info"><span>H2O</span><span id="water-text">100 / 100</span></div>
            <div id="water-track"><div id="water-fill"></div></div>
            <div id="hunger-info"><span>HUNGER</span><span id="hunger-text">100 / 100</span></div>
            <div id="hunger-track"><div id="hunger-fill"></div></div>
        </div>
        <div id="world">
            <div id="scene">
                <div id="garden"><img id="house-image" src="house.png" alt="Dům a zahrada"></div>
                <div id="house"><div id="roof"></div><div id="door"></div></div>
                <div id="tree" class="object"></div>
                <img id="well" src="studna.png" alt="Kamenná studna" draggable="false">
                <img id="log" src="log.png" alt="Dřevěná kláda" draggable="false">
                <div id="fireplace"></div>
                <img id="fire" src="fire.gif" alt="Animovaný oheň" draggable="false">
                <div id="player" aria-label="Postavička"></div>
            </div>
        </div>
        <div id="hint">WASD / šipky · Pohyb | E · Interakce | 1–5 · Inventář</div>
        <div id="dialog" hidden></div>
        <div id="water-feedback" aria-live="polite"></div>
        <div id="death-screen" hidden>
            <div id="death-content">
                <h1>YOU DIED</h1>
                <p>Po smrti tady nic neni?</p>
                <button id="restart-button" type="button">RESTART</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
